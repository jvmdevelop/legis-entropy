# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS — self-signed cert pinned to the Oracle host IP (129.153.146.176)
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/129.153.146.176.crt;
    ssl_certificate_key /etc/nginx/certs/129.153.146.176.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy → Spring Cloud Gateway (plain HTTP inside docker network)
    location /api/ {
        proxy_pass http://gateway-service:8084/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Admin auth check (used internally by auth_request)
    location = /internal/auth-check {
        internal;
        proxy_pass http://gateway-service:8084/internal/auth/check-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # Grafana proxy — admin only via auth_request
    location /monitoring/grafana/ {
        auth_request /internal/auth-check;
        error_page 401 403 = @monitoring_denied;

        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Prometheus proxy — admin only via auth_request
    location /monitoring/prometheus/ {
        auth_request /internal/auth-check;
        error_page 401 403 = @monitoring_denied;

        proxy_pass http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location @monitoring_denied {
        return 403 '{"error":"Admin access required"}';
        add_header Content-Type application/json;
    }
}
