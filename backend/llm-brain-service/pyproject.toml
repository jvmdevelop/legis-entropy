[project]
name = "llm-brain-service"
version = "0.1.0"
description = "Legal AI assistant brain: intent -> retrieval -> LLM (RK / RF law)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",
    "openai==1.59.7",
    "py-eureka-client==0.11.13",
    "prometheus-client==0.21.1",
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
ml = [
    "torch==2.5.1",
    "transformers==4.47.1",
    "sentence-transformers==3.3.1",
    "gliner==0.2.16",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "respx==0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
