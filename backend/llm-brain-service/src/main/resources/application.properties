spring.application.name=llm-brain-service
server.port=8085
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
spring.ai.openai.api-key=${LLM_API_KEY:ollama}
spring.ai.openai.base-url=${LLM_BASE_URL:http://localhost:11434/v1}
spring.ai.openai.chat.options.model=${LLM_MODEL:qwen2.5:7b}
spring.ai.openai.chat.options.temperature=${LLM_TEMPERATURE:0.2}
graph.service.url=${GRAPH_SERVICE_URL:http://localhost:8086}

deep-analysis.max-laws-total=${DEEP_ANALYSIS_MAX_LAWS_TOTAL:25}
deep-analysis.max-articles-total=${DEEP_ANALYSIS_MAX_ARTICLES_TOTAL:75}
deep-analysis.max-conflicts=${DEEP_ANALYSIS_MAX_CONFLICTS:10}
deep-analysis.primary-laws=${DEEP_ANALYSIS_PRIMARY_LAWS:5}
deep-analysis.articles-per-law=${DEEP_ANALYSIS_ARTICLES_PER_LAW:3}
deep-analysis.related-per-law-hop2=${DEEP_ANALYSIS_RELATED_PER_LAW_HOP2:3}
deep-analysis.related-per-law-hop3=${DEEP_ANALYSIS_RELATED_PER_LAW_HOP3:2}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=unrestricted

