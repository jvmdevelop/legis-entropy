spring.application.name=chat-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8082
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=30000
spring.cloud.openfeign.client.config.llm-brain-service.readTimeout=120000
brain.stream.url=http://llm-brain-service/api/brain/chat/stream

feign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.llm-brain-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.llm-brain-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.llm-brain-service.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.llm-brain-service.permittedNumberOfCallsInHalfOpenState=3

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=unrestricted
