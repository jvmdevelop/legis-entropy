spring.application.name=template-service
spring.threads.virtual.enabled=true
server.port=8091

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/documentsdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket=${MINIO_BUCKET:user-documents}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=unrestricted
