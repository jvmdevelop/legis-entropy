spring.application.name=documents-manager-service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/documentsdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Neo4j Configuration
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:neo4j}
spring.data.neo4j.database=${NEO4J_DATABASE:neo4j}

# Server Configuration
server.port=8083
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Настройка pgvector
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.initialize-schema=true

# Embedding model — 384 dims
# Multilingual (ru/kk/en) — cross-lingual vector search
# Model served from Spring AI CDN (no auth required)
spring.ai.embedding.transformer.onnx.model-uri=https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/heads/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.onnx.tokenizer-uri=https://raw.githubusercontent.com/spring-projects/spring-ai/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
spring.ai.embedding.transformer.resource-cache-dir=/app/embeddings-cache
spring.ai.embedding.transformer.onnx.resource.device=CPU
# To switch to a multilingual model (requires HuggingFace token or self-hosted):
# spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L6-v2/resolve/main/onnx/model.onnx
# spring.ai.embedding.transformer.onnx.tokenizer-uri=https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L6-v2/resolve/main/tokenizer.json

# Kazakhstan Parser Configuration
parser.kz.base-url=https://adilet.zan.kz
parser.kz.search-path=/rus/search/docs

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# MinIO object storage for uploaded source documents
app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket=${MINIO_BUCKET:user-documents}

# Voice STT: set provider=whisper to enable OpenAI-compatible transcription.
# Defaults point at the local `faster-whisper-server` container shipped in
# docker-compose; override base-url to use a hosted provider (Groq, etc.).
voice.stt.provider=${VOICE_STT_PROVIDER:whisper}
voice.stt.whisper.base-url=${VOICE_STT_BASE_URL:http://whisper:8000/v1}
voice.stt.whisper.model=${VOICE_STT_MODEL:Systran/faster-whisper-base}
voice.stt.whisper.api-key=${VOICE_STT_API_KEY:}
