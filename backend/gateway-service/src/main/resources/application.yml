spring:
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 15m
  threads:
    virtual:
      enabled: true
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          streaming-media-types:
            - text/event-stream
            - text/event-stream;charset=UTF-8
            - application/x-ndjson
          streaming-buffer-size: 1024
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      access: unrestricted
