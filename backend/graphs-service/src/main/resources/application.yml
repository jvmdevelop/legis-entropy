spring:
  application:
    name: graphs-service
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
  neo4j:
    uri: ${NEO4J_URI:neo4j://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8086
  servlet:
    context-path: /

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.jvmd: DEBUG
    org.springframework.data.neo4j: DEBUG

dms:
  base-url: ${DMS_BASE_URL:http://localhost:8083}

parser:
  # Skip persisting laws marked EXPIRED / INVALID / PARSE_ERROR.
  # Default true so the graph holds only the currently-in-force redaction
  # of every law and article. Flip to false for one-off historical backfills.
  skip-expired: true
  kz:
    # Primary source: Эталонный контрольный банк НПА (Минюст РК).
    # Replaces adilet.zan.kz which has been unstable; zan.gov.kz exposes a
    # clean JSON API at /api/documents/{code}/{lang} with structured content.
    base-url: https://zan.gov.kz
    search-path: /api/documents/search
