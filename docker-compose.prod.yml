x-java-build: &java-build
  context: ./backend
  dockerfile: Dockerfile

x-java-service: &java-service
  networks:
    - legis-entropy-network
  environment:
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  deploy:
    resources:
      limits:
        memory: 768M
  healthcheck:
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 55s


services:
  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    networks:
      - legis-entropy-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  postgres-chat:
    image: postgres:16-alpine
    container_name: postgres-chat
    networks:
      - legis-entropy-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CHAT_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres-chat-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${CHAT_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  postgres-documents:
    image: pgvector/pgvector:pg16
    container_name: postgres-documents
    networks:
      - legis-entropy-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DOCUMENTS_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - postgres-documents-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DOCUMENTS_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  postgres-workspace:
    image: postgres:16-alpine
    container_name: postgres-workspace
    networks:
      - legis-entropy-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${WORKSPACE_DB_NAME:-workspacedb}
    ports:
      - "5436:5432"
    volumes:
      - postgres-workspace-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${WORKSPACE_DB_NAME:-workspacedb}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - legis-entropy-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - legis-entropy-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j-data:/var/lib/neo4j/data
      - neo4j-logs:/var/lib/neo4j/logs
    networks:
      - legis-entropy-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474" ]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:9.0.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - legis-entropy-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper
    environment:
      WHISPER__MODEL: ${VOICE_STT_MODEL:-Systran/faster-whisper-base}
      WHISPER__COMPUTE_TYPE: int8
      ENABLE_UI: "false"
    ports:
      - "${WHISPER_PORT:-8000}:8000"
    volumes:
      - whisper-cache:/root/.cache/huggingface
    networks:
      - legis-entropy-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - local
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - legis-entropy-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  eureka-server:
    <<: *java-service
    container_name: eureka-server
    build:
      <<: *java-build
      args:
        SERVICE_NAME: eureka-server
    ports:
      - "${LOAD_BALANCER_PORT}:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1" ]

  auth-service:
    <<: *java-service
    container_name: auth-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: auth-service
    ports:
      - "${AUTH_SERVICE_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION}
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      eureka-server: { condition: service_started }
      user-service: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]

  user-service:
    <<: *java-service
    container_name: user-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: user-service
    ports:
      - "${USER_SERVICE_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres-user: { condition: service_healthy }
      eureka-server: { condition: service_started }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1" ]

  chat-service:
    <<: *java-service
    container_name: chat-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: chat-service
    ports:
      - "${CHAT_SERVICE_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-chat:5432/${CHAT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-chat: { condition: service_healthy }
      eureka-server: { condition: service_started }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1" ]

  template-service:
    <<: *java-service
    container_name: template-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: template-service
    ports:
      - "${TEMPLATE_SERVICE_PORT:-8091}:8091"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres-documents:5432/${DOCUMENTS_DB_NAME}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-documents}
    depends_on:
      postgres-documents: { condition: service_healthy }
      minio: { condition: service_healthy }
      eureka-server: { condition: service_started }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8091/actuator/health || exit 1" ]

  llm-brain-service:
    <<: *java-service
    container_name: llm-brain-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: llm-brain-service
    ports:
      - "${LLM_BRAIN_SERVICE_PORT:-8085}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      GRAPH_SERVICE_URL: http://graphs-service:8086
      DEEP_ANALYSIS_MAX_LAWS_TOTAL: ${DEEP_ANALYSIS_MAX_LAWS_TOTAL:-25}
      DEEP_ANALYSIS_MAX_ARTICLES_TOTAL: ${DEEP_ANALYSIS_MAX_ARTICLES_TOTAL:-75}
      DEEP_ANALYSIS_MAX_CONFLICTS: ${DEEP_ANALYSIS_MAX_CONFLICTS:-10}
      DEEP_ANALYSIS_PRIMARY_LAWS: ${DEEP_ANALYSIS_PRIMARY_LAWS:-5}
      DEEP_ANALYSIS_ARTICLES_PER_LAW: ${DEEP_ANALYSIS_ARTICLES_PER_LAW:-3}
      DEEP_ANALYSIS_RELATED_PER_LAW_HOP2: ${DEEP_ANALYSIS_RELATED_PER_LAW_HOP2:-3}
      DEEP_ANALYSIS_RELATED_PER_LAW_HOP3: ${DEEP_ANALYSIS_RELATED_PER_LAW_HOP3:-2}
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-false}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://ollama:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.2:3b}
    depends_on:
      eureka-server: { condition: service_started }
      document-service: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1" ]

  graphs-service:
    <<: *java-service
    container_name: graphs-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: graphs-service
    ports:
      - "${GRAPHS_SERVICE_PORT:-8086}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      ELASTICSEARCH_URI: http://elasticsearch:9200
      DMS_BASE_URL: http://law-service:8087
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      neo4j: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }
      eureka-server: { condition: service_started }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8086/actuator/health || exit 1" ]

  workspace-service:
    <<: *java-service
    container_name: workspace-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: workspace-service
    ports:
      - "${WORKSPACE_SERVICE_PORT:-8088}:8088"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-workspace:5432/${WORKSPACE_DB_NAME:-workspacedb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-workspace: { condition: service_healthy }
      eureka-server: { condition: service_started }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/actuator/health || exit 1" ]

  document-service:
    <<: *java-service
    container_name: document-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: document-service
    ports:
      - "${DOCUMENT_SERVICE_PORT:-8093}:8093"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      DB_URL: jdbc:postgresql://postgres-documents:5432/${DOCUMENTS_DB_NAME}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-documents}
    volumes:
      - document-embeddings-cache:/app/embeddings-cache
    deploy:
      resources:
        limits:
          memory: 1536M
    depends_on:
      postgres-documents: { condition: service_healthy }
      minio: { condition: service_healthy }
      eureka-server: { condition: service_started }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8093/actuator/health || exit 1" ]

  law-service:
    <<: *java-service
    container_name: law-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: law-service
    ports:
      - "${LAW_SERVICE_PORT:-8087}:8087"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-documents:5432/${DOCUMENTS_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    volumes:
      - law-embeddings-cache:/app/embeddings-cache
    depends_on:
      postgres-documents: { condition: service_healthy }
      redis: { condition: service_healthy }
      eureka-server: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health || exit 1" ]

  situation-service:
    <<: *java-service
    container_name: situation-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: situation-service
    ports:
      - "${SITUATION_SERVICE_PORT:-8092}:8092"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
    depends_on:
      neo4j: { condition: service_healthy }
      eureka-server: { condition: service_started }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8092/actuator/health || exit 1" ]

  voice-service:
    <<: *java-service
    container_name: voice-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: voice-service
    ports:
      - "${VOICE_SERVICE_PORT:-8090}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres-documents:5432/${DOCUMENTS_DB_NAME}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-documents}
      VOICE_STT_PROVIDER: ${VOICE_STT_PROVIDER:-whisper}
      VOICE_STT_BASE_URL: ${VOICE_STT_BASE_URL:-http://whisper:8000/v1}
      VOICE_STT_MODEL: ${VOICE_STT_MODEL:-Systran/faster-whisper-base}
      VOICE_STT_API_KEY: ${VOICE_STT_API_KEY:-}
    depends_on:
      postgres-documents: { condition: service_healthy }
      minio: { condition: service_healthy }
      eureka-server: { condition: service_started }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/actuator/health || exit 1" ]

  gateway-service:
    <<: *java-service
    container_name: gateway-service
    build:
      <<: *java-build
      args:
        SERVICE_NAME: gateway-service
    ports:
      - "${GATEWAY_SERVICE_PORT}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server: { condition: service_started }
      auth-service: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1" ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - legis-entropy-network
    depends_on:
      gateway-service: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - legis-entropy-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - legis-entropy-network
    depends_on:
      - prometheus


networks:
  legis-entropy-network:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-chat-data:
  postgres-documents-data:
  postgres-workspace-data:
  redis-data:
  minio-data:
  neo4j-data:
  neo4j-logs:
  whisper-cache:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  ollama-data:
  document-embeddings-cache:
  law-embeddings-cache: