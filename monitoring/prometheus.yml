global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8080']

  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-service:8081']

  - job_name: 'chat-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['chat-service:8082']

  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway-service:8084']

  - job_name: 'llm-brain-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['llm-brain-service:8085']

  - job_name: 'workspace-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['workspace-service:8088']
